name: eo_products

on:
  workflow_dispatch:

  push:
    tags:
      - "eo-products-v*"
      - "docs-v*"
    paths:
      - ".github/workflows/eo_products.yml"
      - "src/eo_products/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  analysis:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    strategy:
      fail-fast: false
      matrix:
        task:
          - check_format
          - pylint

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - run: echo "/opt/python/cp312-cp312/bin" >> $GITHUB_PATH
      - run: python --version
      - run: python -m pip install nox
      - run: python -m nox -s ${{ matrix.task }}

  sdist:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - run: echo "/opt/python/cp312-cp312/bin" >> $GITHUB_PATH
      - run: python --version
      - run: python -m pip install nox
      - run: python -m nox -s build_sdist

      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14

  wheel:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - run: echo "/opt/python/cp312-cp312/bin" >> $GITHUB_PATH
      - run: python --version
      - run: python -m pip install nox
      - run: python -m nox -s build_wheel

      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 14

  docs_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install nox

      - name: Build docs
        run: |
          python -m nox -s build_doc
          ls -la site/

      - name: Upload docs site
        uses: actions/upload-artifact@v5
        with:
          name: docs-site
          path: site/
          retention-days: 14

  docs_publish:
    if: startsWith(github.ref_name, 'docs-v')
    needs: docs_build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download docs site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    if: startsWith(github.ref_name, 'eo-products-v')

    needs:
      - sdist
      - wheel
      - analysis

    runs-on: ubuntu-latest

    environment: eo-products-pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Clean dist
        run: |
          find dist -type f ! -name "*.whl" ! -name "*.tar.gz" -delete

      - name: Show artifacts
        run: |
          find dist -type f -maxdepth 2

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
